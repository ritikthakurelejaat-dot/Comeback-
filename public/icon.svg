<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B0F19" />
      <stop offset="100%" stopColor="#030712" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE047" />
      <stop offset="50%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#EF4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#1E293B" stroke-width="8" />

  <!-- Kinetic Combat Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(245, 158, 11, 0.25)" stroke-width="4" stroke-dasharray="16 12" />

  <!-- Comeback Arrow / Lightning Strike Symbol -->
  <g filter="url(#glow)">
    <path d="M256 90 L360 270 L275 270 L305 420 L160 230 L235 230 Z" fill="url(#gold)" />
  </g>

  <!-- Accent sparks -->
  <circle cx="150" cy="150" r="8" fill="#F59E0B" />
  <circle cx="370" cy="140" r="6" fill="#EF4444" />
  <circle cx="360" cy="380" r="10" fill="#38BDF8" />
  <circle cx="140" cy="360" r="7" fill="#FDE047" />
</svg>
